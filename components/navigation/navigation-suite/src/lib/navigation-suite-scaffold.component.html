<div
  class="mat-navigation-suite-scaffold__layout"
  [style.--flight-nav-suite-scaffold-container-color]="containerColorValue()"
>
  <aside
    class="mat-navigation-suite-scaffold__navigation"
    [attr.aria-hidden]="currentState().targetValue() === 'hidden' ? 'true' : null"
    [attr.inert]="currentState().targetValue() === 'hidden' ? '' : null"
  >
    @if (isBar()) {
      @if (primaryActionTemplate(); as primaryAction) {
        <div
          class="mat-navigation-suite-scaffold__primary-action"
          [class.mat-navigation-suite-scaffold__primary-action--align-start]="
            primaryActionAlignment() === 'start'
          "
          [class.mat-navigation-suite-scaffold__primary-action--align-center]="
            primaryActionAlignment() === 'center'
          "
          [class.mat-navigation-suite-scaffold__primary-action--align-end]="
            primaryActionAlignment() === 'end'
          "
        >
          <ng-container
            [ngTemplateOutlet]="primaryAction"
            [ngTemplateOutletContext]="primaryActionContext()"
          ></ng-container>
        </div>
      }
    }

    <div class="mat-navigation-suite-scaffold__suite">
      <ng-content select="mat-navigation-suite"></ng-content>
    </div>
  </aside>

  <main class="mat-navigation-suite-scaffold__content">
    <ng-content></ng-content>
  </main>
</div>
