<div class="mat-navigation-bar-item-container" 
     [class.mat-navigation-bar-item-selected]="active()" 
     [class.mat-navigation-bar-item-always-show-label]="alwaysShowLabel()"
     [class.mat-navigation-bar-item-horizontal]="layout() === 'horizontal'">
  
  <div class="mat-navigation-bar-item-icon-wrapper">
    <div class="mat-navigation-bar-item-active-indicator" matRipple [matRippleCentered]="true" [matRippleDisabled]="disabled()"></div>
    <div class="mat-navigation-bar-item-icon-content">
      @if (active() && activeIcon) {
        <ng-content select="[matNavigationActiveIcon], [matNavActiveIcon]"></ng-content>
      } @else {
        <ng-content select="[matNavigationIcon], [matNavIcon]"></ng-content>
      }
    </div>

    @if (layout() === 'horizontal') {
      <div class="mat-navigation-bar-item-label-content-horizontal"
           [class.mat-navigation-bar-item-label-hidden]="!active() && !alwaysShowLabel()">
        @if (label) {
          <ng-container *ngTemplateOutlet="label.templateRef || null"></ng-container>
        }
      </div>
    }
  </div>

  @if (layout() === 'vertical') {
    <div class="mat-navigation-bar-item-label-container"
         [class.mat-navigation-bar-item-label-hidden]="!active() && !alwaysShowLabel()">
      <div class="mat-navigation-bar-item-label-content">
        @if (label) {
          <ng-container *ngTemplateOutlet="label.templateRef || null"></ng-container>
        }
      </div>
    </div>
  }
</div>
