when:
  - event: ['push', 'manual']
    branch: ['main']

engine: 'nixery'

clone:
  depth: 0

dependencies:
  nixpkgs:
    - git
    - openssh

steps:
  - name: 'Setup SSH for GitHub'
    command: |
      mkdir -p ~/.ssh
      echo "$DEPLOY_2_GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts
      # Debug: check key is present
      KEY_LENGTH=$(wc -c < ~/.ssh/id_ed25519)
      echo "SSH key size: $KEY_LENGTH bytes (should be >0)"
      if [ "$KEY_LENGTH" -eq 0 ]; then
        echo "ERROR: DEPLOY_2_GITHUB_SSH_KEY secret is empty or not configured."
        exit 1
      fi

  - name: 'Verify SSH key fingerprint'
    command: |
      echo "Public key fingerprint (should match GitHub deploy key):"
      ssh-keygen -lf ~/.ssh/id_ed25519
      echo "Public key content:"
      ssh-keygen -y -f ~/.ssh/id_ed25519 2>&1

  - name: 'Push mirror to GitHub'
    command: |
      export GIT_SSH_COMMAND="ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
      git remote set-url mirror git@github.com:FairyLightsStudio/AngularM3EComponents 2>/dev/null \
        || git remote add mirror git@github.com:FairyLightsStudio/AngularM3EComponents
      git push --mirror mirror
