when:
  - event: ['push', 'manual']
    branch: ['main']

engine: 'nixery'

clone:
  depth: 0

dependencies:
  nixpkgs:
    - git
    - openssh

steps:
  - name: 'Setup SSH for GitHub'
    command: |
      mkdir -p ~/.ssh
      echo "$DEPLOY_2_GITHUB_SSH_KEY" > ~/.ssh/id_ed25519
      chmod 600 ~/.ssh/id_ed25519
      ssh-keyscan -H github.com >> ~/.ssh/known_hosts

  - name: 'Push mirror to GitHub'
    command: |
      git remote set-url mirror git@github.com:FairyLightsStudio/AngularM3EComponents 2>/dev/null \
        || git remote add mirror git@github.com:FairyLightsStudio/AngularM3EComponents
      git push --mirror mirror
